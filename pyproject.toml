[project]
name = "sna-mcp"
version = "0.1.0"
description = "MCP server for Cisco Secure Network Analytics (SNA / Stealthwatch Enterprise) REST API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-httpx>=0.36.0,<1.0.0",
]

[project.urls]
Repository = "https://github.com/CiscoDevNet/secure-network-analytics-mcp-community"

[project.scripts]
sna-mcp = "sna_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sna_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
